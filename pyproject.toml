[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "macbot"
version = "2.1.0"
description = "Local, permission-gated voice assistant for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "flask>=3.1.3,<4",
  "flask-socketio>=5.6.1,<6",
  "simple-websocket>=1.1,<2",
  "httpx>=0.28.1,<0.29",
  "PyYAML>=6.0.2,<7",
  "pydantic>=2.13.5,<3",
  "numpy>=2.2.5,<3",
  "scipy>=1.14,<2",
  "psutil>=7,<8",
  "soundfile>=0.13,<1",
  "onnxruntime>=1.29,<2",
  "tokenizers>=0.22,<0.24",
  "piper-tts==1.7.0",
  "kokoro-onnx==0.6.1",
  "pypdf>=6.16.2,<7",
  "python-docx>=1.2,<2",
  "huggingface-hub>=1.0,<2",
  "parakeet-mlx==0.5.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "ddgs>=9.16,<10",
  "cryptography>=50,<51",
  "mlx-audio==0.5.0",
]

[project.optional-dependencies]
mlx = ["mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
    "mypy>=2,<3",
    "pip-audit>=2.10,<3",
    "build>=1.4,<2",
    "types-PyYAML",
    "types-requests",
    "types-psutil",
    "pyarrow>=25.0.1",
    "detect-secrets>=1.5.0",
]

[project.scripts]
macbot = "macbot.cli:main"
macbot-orchestrator = "macbot.orchestrator:main"
macbot-dashboard = "macbot.web_dashboard:main"
macbot-rag = "macbot.rag_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macbot"]

[tool.hatch.build.targets.sdist]
include = ["/src/macbot", "/tests", "/scripts", "/docs", "/config/config.yaml", "/pyproject.toml", "/uv.lock", "/README.md", "/Makefile", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["models: requires provisioned real model weights", "device: requires microphone and speakers with operator present"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
